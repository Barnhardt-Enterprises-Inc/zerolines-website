# Managed by quetrex-sync: an independent Claude review of every PR. It runs in its own
# session, so the agent that wrote the change never reviews itself. Findings land as inline
# PR comments. Auth: the org-level Actions secret CLAUDE_CODE_OAUTH_TOKEN.
name: Claude Review

on:
  # `synchronize` was removed 2026-11-19 to cut model usage, matching marketing51-glori since
  # 2026-11-12. It fired a full review on EVERY push to an open PR; `cancel-in-progress` below
  # bounded that (a rapid follow-up push cancels the previous run) but every settled push still
  # paid for a complete review, so a PR pushed to six times paid up to six times to review
  # substantially the same diff.
  # A review still runs when the PR is opened, reopened, or marked ready for review.
  # To re-review after pushing a fix: re-run the `review` job from the Actions tab, or convert
  # the PR to draft and back to ready. Do not re-add `synchronize` without a usage budget for it.
  pull_request:
    types: [opened, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
